services:
  postgres:
    image: postgres:16-alpine
    container_name: reservaya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reservaya
      POSTGRES_PASSWORD: reservaya
      POSTGRES_DB: reservaya
    ports:
      - "127.0.0.1:5433:5432" # solo local: sin esto Postgres queda abierto en la red (wifi de un café)
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: reservaya-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017" # Mongo no tiene usuario ni contraseña acá
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data:
