databases:
  - name: reservaya-db
    plan: free
    region: oregon

services:
  - type: web
    name: reservaya-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reservaya-db
          property: connectionString
      - key: MONGO_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://reservaya-frontend.onrender.com

  - type: web
    name: reservaya-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://reservaya-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
