databases:
  - name: reservaya-db
    plan: free
    region: oregon

services:
  - type: web
    name: reservaya-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reservaya-db
          property: connectionString
      - key: MONGO_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://reservaya-frontend.onrender.com
      # el demo del portfolio necesita datos; solo siembra si la base está vacía
      - key: SEED_DEMO_IF_EMPTY
        value: "true"

  - type: web
    name: reservaya-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # el nombre "reservaya-api" ya estaba tomado en Render y el servicio quedó con sufijo;
      # reservaya-api.onrender.com es la app de otra persona
      - key: VITE_API_URL
        value: https://reservaya-api-6h48.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
